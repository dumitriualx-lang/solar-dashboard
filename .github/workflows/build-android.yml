# Solar Dashboard build — YOUR original workflow, with exactly 3 changes
# required by the API 36 / AGP 8.9.2 upgrade (marked with "API36 CHANGE"):
#   1. Gradle 8.7  -> 8.11.1   (AGP 8.9.2 requires >= 8.11.1)
#   2. platform 34 -> 36       (compileSdk 36)
#   3. Collect version.json    (emitted by build-twa.py for the update popup)
# Everything else — secret name SIGNING_KEY_BASE64, script name build-twa.py,
# keystore verification steps, artifact layout — is unchanged from yours.

name: Build Solar Dashboard
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # API36 CHANGE 1: Gradle 8.11.1 (AGP 8.9.2 minimum). Was 8.7.
      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/
          sudo ln -sf /opt/gradle-8.11.1/bin/gradle /usr/local/bin/gradle
          gradle --version | head -3
      # API36 CHANGE 2: platform/build-tools 36 (compileSdk 36). Was 34.
      - name: Install Android SDK platforms
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-36" "build-tools;36.0.0" --channel=0 2>&1 | tail -3
          echo "SDK ready"
      - name: Install Pillow
        run: pip install Pillow --break-system-packages -q
      - name: Prepare Keystore from secret
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > $HOME/solar.keystore
          echo "Keystore size: $(wc -c < $HOME/solar.keystore) bytes"
          echo "=== All aliases ==="
          keytool -list -keystore $HOME/solar.keystore -storepass solar2024 2>&1
          echo "=== SHA256 solar-key alias ==="
          keytool -list -v -keystore $HOME/solar.keystore -alias solar-key -storepass solar2024 2>&1 | grep -E "SHA256:|Alias" || echo "solar-key not found"
          echo "================================================"
      - name: Generate Android project
        run: python3 $GITHUB_WORKSPACE/build-twa.py
      - name: Verify keystore before build
        run: |
          echo "=== KEYSTORE SHA BEFORE BUILD ==="
          keytool -list -v -keystore $HOME/solar.keystore -storepass solar2024 2>&1 | grep "SHA256:" || echo "MISSING"
          ls -la $HOME/solar.keystore
      - name: Build APK
        run: |
          cd $HOME/twa
          gradle assembleRelease --no-daemon 2>&1
          echo "APK exit: $?"
      - name: Verify keystore after build
        run: |
          echo "=== KEYSTORE SHA AFTER BUILD ==="
          keytool -list -v -keystore $HOME/solar.keystore -storepass solar2024 2>&1 | grep "SHA256:" || echo "MISSING"
          ls -la $HOME/solar.keystore
      - name: Build AAB
        if: success()
        run: |
          cd $HOME/twa
          gradle bundleRelease --no-daemon 2>&1 | tail -10
          echo "AAB exit: $?"
      - name: List outputs
        if: always()
        run: |
          echo "=== APK ===" && find $HOME/twa -name "*.apk" 2>/dev/null || echo "none"
          echo "=== AAB ===" && find $HOME/twa -name "*.aab" 2>/dev/null || echo "none"
      - name: Collect outputs
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find $HOME/twa -name "*.apk" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          find $HOME/twa -name "*.aab" -exec cp {} $GITHUB_WORKSPACE/output/ \; 2>/dev/null || true
          # API36 CHANGE 3: build-twa.py now emits version.json (update popup).
          # Deploy it to GitHub Pages next to index.html after each release.
          cp $HOME/twa/version.json $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          cp $HOME/solar.keystore $GITHUB_WORKSPACE/output/ 2>/dev/null || true
          base64 -w 0 $HOME/solar.keystore > $GITHUB_WORKSPACE/output/solar.keystore.b64 2>/dev/null || true
          echo "=== Output files ==="
          ls -lh $GITHUB_WORKSPACE/output/
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-dashboard-android
          path: output/
          retention-days: 30
