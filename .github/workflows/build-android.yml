# GitHub Actions workflow — Solar Dashboard APK/AAB build
# Place at: .github/workflows/build-apk.yml
#
# WHAT CHANGED vs your old workflow (the API-36 fixes):
#   1. Gradle pinned to 8.11.1  (was 8.7 — AGP 8.9.2 requires >= 8.11.1)
#   2. JDK explicitly 17        (AGP 8.9.x requires JDK 17+)
#   3. Android platform 36 installed explicitly (compileSdk 36)
#
# If your existing workflow already handles the keystore secret and artifact
# upload differently, keep YOUR steps and only port items 1-3.

name: Build Solar Dashboard

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── CHANGE 2: JDK 17 (required by AGP 8.9.x) ─────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── CHANGE 1: Gradle 8.11.1 (required by AGP 8.9.2) ──────────────────
      # This was the cause of your build failure: the workflow provided
      # Gradle 8.7 while AGP 8.9.2 requires >= 8.11.1.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # ── CHANGE 3: make sure Android platform 36 is present ───────────────
      # ubuntu-latest images usually lag one platform behind; installing
      # explicitly costs ~20s and removes the guesswork.
      - name: Install Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # ── Keystore: decode from repo secret to the path build.gradle expects
      # The emitted build.gradle hardcodes storeFile $HOME/solar.keystore.
      # Assumes you have a base64-encoded keystore in secrets.KEYSTORE_B64.
      # If your existing workflow restores the keystore differently
      # (different secret name, actions/download, etc.), KEEP YOUR VERSION.
      - name: Restore signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$HOME/solar.keystore"

      # ── Generate the Android project (Python emits Java/Gradle to ~/twa) ─
      # GITHUB_RUN_NUMBER is read by the script for versionCode auto-increment.
      # The glob tolerates any variant of the script's filename in the repo
      # (build-twa.py, build_twa.py, build-twa__14_.py, ...). Fails loudly if
      # no matching file is found.
      - name: Generate project from build script
        run: |
          SCRIPT=$(ls build*twa*.py build_twa*.py twa*.py 2>/dev/null | head -1)
          if [ -z "$SCRIPT" ]; then
            echo "ERROR: no build script found in repo root. Files present:"
            ls -la
            exit 1
          fi
          echo "Using build script: $SCRIPT"
          python3 "$SCRIPT"

      # ── Build. bundleRelease produces the AAB Play Console requires. ─────
      # assembleRelease additionally produces an APK for sideload testing.
      - name: Build release AAB + APK
        run: |
          cd "$HOME/twa"
          gradle bundleRelease assembleRelease --no-daemon

      # ── Surface the artifacts ────────────────────────────────────────────
      - name: Upload AAB (for Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: solar-dashboard-aab
          path: ~/twa/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (for direct install / testing)
        uses: actions/upload-artifact@v4
        with:
          name: solar-dashboard-apk
          path: ~/twa/app/build/outputs/apk/release/app-release.apk

      # ── version.json is emitted by the build script for the update popup ─
      # Deploy this to GitHub Pages alongside index.html after the release.
      - name: Upload version.json
        uses: actions/upload-artifact@v4
        with:
          name: version-json
          path: ~/twa/version.json
          if-no-files-found: ignore
